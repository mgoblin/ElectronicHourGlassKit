name: Build ehgk2any executable

on:
    push:
        paths:
        - 'src/utils/ehgk_hex_utils/**'
        - '.github/workflows/ehgk2any.yml'
        - '.github/actions/**'
    workflow_dispatch: 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13' 

      - name: Install dependencies
        working-directory: src/utils/ehgk_hex_utlis
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build with PyInstaller
        working-directory: src/utils/ehgk_hex_utlis
        run: |
          pyinstaller --onefile --name ehgk src/ehgk/ehgk2any.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ehgk2any-${{ matrix.os }}
          path: dist/