name: Build LED visual control component

on: 
  push:
    paths:
      - 'src/utils/ui_editor/lazarus/led_control/**'
      - '.github/workflows/led_control.yml'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate build matrix
        id: gen
        uses: ./.github/actions/make-matrix

      - name: Debug matrix
        run: echo '${{ steps.gen.outputs.matrix }}'

  build-led-control-component:
    needs: prepare-matrix
    strategy: 
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}  
    name: ${{ matrix.name }}
    steps:

      - name: Checkout sources
        uses: actions/checkout@v7.0.1

      - name: Install Lazarus
        uses: ollydev/setup-lazarus@v4.2
        with:
          laz-url: ${{ matrix.laz-url }}
          fpc-url: ${{ matrix.fpc-url }}
          use-cache: true

      - name: Install Lazarus dependencies
        uses: ./.github/actions/install-lazarus-deps
        with:
          widgetset: ${{ matrix.widgetset }}
          os-name: ${{ matrix.name }}    
      
      - name: Build LED control package
        uses: ./.github/actions/build-led-control-component
        with:
          widgetset: ${{ matrix.widgetset }}
      
      - name: Run LED control unit tests
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          case "$MATRIX_NAME" in
            Linux*)
            xvfb-run -a src/utils/ui_editor/lazarus/led_control/test/LedUnitTests
            ;;
          *)
            src/utils/ui_editor/lazarus/led_control/test/LedUnitTests
            ;;
          esac

          echo "## Unit tests Results 🚀" >> $GITHUB_STEP_SUMMARY
          if grep -q '<NumberOfErrors>0</NumberOfErrors>' result.xml && grep -q '<NumberOfFailures>0</NumberOfFailures>' result.xml; then
            echo "The build finished successfully at $(date)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Unit tests failed at $(date)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi  

