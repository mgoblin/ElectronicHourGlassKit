name: Build LED visual control component

on: 
  push:
    paths:
      - 'src/utils/ui_editor/lazarus/components/led_control/**'
      - '.github/workflows/led_control.yml'

jobs:
  prepare-matrix:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Generate build matrix
        id: gen
        uses: ./.github/actions/make-matrix

      - name: Debug matrix
        run: echo '${{ steps.gen.outputs.matrix }}'

  build-led-control-component:
    needs: prepare-matrix
    strategy: 
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}  
    name: ${{ matrix.name }}
    steps:

      - name: Checkout sources
        uses: actions/checkout@v7.0.1

      - name: Install Lazarus
        uses: ollydev/setup-lazarus@v4.2
        with:
          laz-url: ${{ matrix.laz-url }}
          fpc-url: ${{ matrix.fpc-url }}
          use-cache: true

      - name: Install Lazarus dependencies
        uses: ./.github/actions/install-lazarus-deps
        with:
          widgetset: ${{ matrix.widgetset }}
          os-name: ${{ matrix.name }}    
      
      - name: Build LED control package
        uses: ./.github/actions/build-led-control-component
        with:
          widgetset: ${{ matrix.widgetset }} 
    