name: Build LED visual control component

on: 
  push:
    paths:
      - 'src/utils/ui_editor/lazarus/led_control/**'
      - '.github/workflows/led_control.yml'

jobs:
  test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows-latest
            name: Windows 64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Windows 64 bits/Lazarus 4.2/lazarus-4.2-fpc-3.2.2-win64.exe
            widgetset: win32 

          - os: windows-latest
            name: Windows 32
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Windows 32 bits/Lazarus 4.2/lazarus-4.2-fpc-3.2.2-win32.exe
            widgetset: win32 

          - os: ubuntu-latest
            name: Linux 64 gtk2
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/lazarus-project_4.2.0-0_amd64.deb
            fpc-url: |
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/fpc-laz_3.2.2-210709_amd64.deb
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/fpc-src_3.2.2-210709_amd64.deb
            widgetset: gtk2
            
          - os: ubuntu-latest
            name: Linux 64 qt5
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/lazarus-project_4.2.0-0_amd64.deb
            fpc-url: |
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/fpc-laz_3.2.2-210709_amd64.deb
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/fpc-src_3.2.2-210709_amd64.deb
            widgetset: qt5  

          - os: macos-latest
            name: MacOS 64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.8/lazarus-darwin-x86_64-4.8.zip
            fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg
            widgetset: cocoa
    
    steps:

      - name: Checkout sources
        uses: actions/checkout@v7.0.1

      - name: Install Lazarus
        uses: ollydev/setup-lazarus@v4
        with:
          laz-url: ${{ matrix.config.laz-url }}
          fpc-url: ${{ matrix.config.fpc-url }}
          use-cache: true

      - name: Install Lazarus dependencies
        uses: ./.github/actions/install-lazarus-deps
        with:
          widgetset: ${{ matrix.config.widgetset }}
          os-name: ${{ matrix.config.name }}    
      
      - name: Build LED control package
        run: |
          lazbuild src/utils/ui_editor/lazarus/led_control/src/ledcontrol.lpk
      
      - name: Build LED control package unit tests
        run: |  
          lazbuild --ws=${{ matrix.config.widgetset }} src/utils/ui_editor/lazarus/led_control/test/LedUnitTests.lpi
      
      - name: Run LED control unit tests
        env:
          MATRIX_NAME: ${{ matrix.config.name }}
        run: |
          set -euo pipefail
          case "$MATRIX_NAME" in
            Linux*)
            xvfb-run -a src/utils/ui_editor/lazarus/led_control/test/LedUnitTests
            ;;
          *)
            src/utils/ui_editor/lazarus/led_control/test/LedUnitTests
            ;;
          esac

          echo "## Unit tests Results 🚀" >> $GITHUB_STEP_SUMMARY
          if grep -q '<NumberOfErrors>0</NumberOfErrors>' result.xml && grep -q '<NumberOfFailures>0</NumberOfFailures>' result.xml; then
            echo "The build finished successfully at $(date)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Unit tests failed at $(date)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi  

