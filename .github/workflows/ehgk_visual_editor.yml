name: Build EHGK visual editor

on:
    push:
        paths:
        - 'src/utils/ui_editor/lazarus/ehgk_editor/**'
        - '.github/workflows/ehgk_visual_editor.yml'

jobs:
    build_led_control:
        name: ${{ matrix.config.name }}
        runs-on: ${{ matrix.config.os }}
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                config:
                    - os: windows-latest
                      name: Windows 64
                      laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Windows 64 bits/Lazarus 4.2/lazarus-4.2-fpc-3.2.2-win64.exe
                      widgetset: win32

                    - os: windows-latest
                      name: Windows 32
                      laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Windows 32 bits/Lazarus 4.2/lazarus-4.2-fpc-3.2.2-win32.exe
                      widgetset: win32
                      
                    - os: ubuntu-latest
                      name: Linux 64 gtk2
                      laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/lazarus-project_4.2.0-0_amd64.deb
                      fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/fpc-laz_3.2.2-210709_amd64.deb
                      widgetset: gtk2

                    - os: ubuntu-latest
                      name: Linux 64 qt5
                      laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/lazarus-project_4.2.0-0_amd64.deb
                      fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/fpc-laz_3.2.2-210709_amd64.deb
                      widgetset: qt5
                      
                    - os: macos-latest
                      name: MacOS 64
                      laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus macOS x86-64/Lazarus 4.8/lazarus-darwin-x86_64-4.8.zip
                      fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus macOS x86-64/Lazarus 4.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg
                      widgetset: cocoa 
                       
        steps:
            - name: Install Lazarus
              uses: ollydev/setup-lazarus@v4
              with:
                laz-url: ${{ matrix.config.laz-url }}
                fpc-url: ${{ matrix.config.fpc-url }}
                use-cache: true