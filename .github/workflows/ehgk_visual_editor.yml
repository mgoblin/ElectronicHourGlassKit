name: Build EHGK visual editor

on:
    push:
        paths:
        - 'src/utils/ui_editor/lazarus/app/ehgk_editor/**'
        - '.github/workflows/ehgk_visual_editor.yml'
        - '.github/actions/**'

env:
  led_control_lpk_path: 'src/utils/ui_editor/lazarus/components/led_control/src/ledcontrol.lpk'
  led_control_unittest_lpi_path: 'src/utils/ui_editor/lazarus/components/led_control/test/LedUnitTests.lpi'

  page_components_lpk_path: 'src/utils/ui_editor/lazarus/components/page_components/src/pagecomponents.lpk'
  page_components_unittest_lpi_path: 'src/utils/ui_editor/lazarus/components/page_components/test/EhgkPageUnitTests.lpi'

jobs:
  prepare-matrix:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Generate build matrix
        id: gen
        uses: ./.github/actions/make-matrix

      - name: Debug matrix
        run: echo '${{ steps.gen.outputs.matrix }}'

  build-visual-editor:
      name: ${{ matrix.name }}
      needs: prepare-matrix
      runs-on: ${{ matrix.os }}
      defaults:
          run:
              shell: bash
      strategy:
          fail-fast: false
          matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

      steps:
          - name: Checkout sources
            uses: actions/checkout@v7.0.1
            
          - name: Install Lazarus
            uses: ollydev/setup-lazarus@v4.2
            with:
              laz-url: ${{ matrix.laz-url }}
              fpc-url: ${{ matrix.fpc-url }}
              use-cache: true

          - name: Install Lazarus dependencies for CI build
            uses: ./.github/actions/install-lazarus-deps
            with:
              widgetset: ${{ matrix.widgetset }}
              os-name: ${{ matrix.name }}

          - name: Build LED control package
            uses: ./.github/actions/build-led-control-component
            with:
              widgetset: ${{ matrix.widgetset }}
              component-lpk-path: ${{ env.led_control_lpk_path }}
              unittest-lpi-path: ${{ env.led_control_unittest_lpi_path }}     

          - name: Build page components package
            uses: ./.github/actions/build-page-components
            with:
              widgetset: ${{ matrix.widgetset }}
              component-lpk-path: ${{ env.page_components_lpk_path }}
              unittest-lpi-path: ${{ env.page_components_unittest_lpi_path }}
              
          - name: Build EHGK application
            shell: bash
            run: echo 'Build application started'    