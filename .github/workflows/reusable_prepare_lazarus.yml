name: Reusable install Lazarus and dependencies

on:
  workflow_call:
    inputs:
        os-name:
            required: true
            type: string
        build-env-name:
            required: true
            type: string    

jobs:
    prepare_lazarus:
        name: Install Lazarus and dependencies
        runs-on: ${{ inputs.build-env-name }}
        steps:
            - name: apt update
              if: startsWith(inputs.os-name, 'Linux')
              run: sudo apt update
