name: Build pages component action
description: | 
  Build electronic hourglass kit pages Lazarus component. 
  Needs installed and configured Lazarus for target os and arch.

inputs:
  widgetset:
    description: 'gtk2, qt5 or cocoa'
    required: true
    default: 'gtk2'
  component-src-path:
    description: 'path to pagecomponents.lpk file'
    required: true
    default: 'src/utils/ui_editor/lazarus/components/page_components/src'
  unittest-src-path:
    description: 'path to EhgkPageUnitTests.lpi'
    required: true
    default: 'src/utils/ui_editor/lazarus/components/page_components/test'

runs:
  using: composite
  steps:
    - name: Build page components package
      shell: bash
      run: lazbuild -B --ws=${{ inputs.widgetset }} ${{ inputs.component-src-path }}/pagecomponents.lpk

    - name: Build page components unit tests
      shell: bash
      run: lazbuild -B --ws=${{ inputs.widgetset }} ${{ inputs.unittest-src-path }}/EhgkPageUnitTests.lpi

    - name: Run unit tests
      shell: bash
      env:
        MATRIX_NAME: ${{ matrix.name }}
      run: |
        set -euo pipefail
        case "$MATRIX_NAME" in
          Linux*)
          xvfb-run -a ${{ inputs.unittest-src-path }}/EhgkPageUnitTests
          ;;
        *)
          ${{ inputs.unittest-src-path }}/EhgkPageUnitTests
          ;;
        esac

        echo "## Unit tests Results 🚀" >> $GITHUB_STEP_SUMMARY
        if grep -q '<NumberOfErrors>0</NumberOfErrors>' result.xml && grep -q '<NumberOfFailures>0</NumberOfFailures>' result.xml; then
          echo "The build finished successfully at $(date)" >> $GITHUB_STEP_SUMMARY
        else
          echo "Unit tests failed at $(date)" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi  
