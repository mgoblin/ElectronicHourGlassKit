name: Build LED visual control action
description: | 
  Build LED control Lazarus component. 
  Needs installed and configured Lazarus for target os and arch.

inputs:
  widgetset:
    description: 'gtk2, qt5 or cocoa'
    required: true
    default: 'gtk2'
  component-lpk-path:
    description: 'path to ledcontrol.lpk file'
    required: true
    default: 'src/utils/ui_editor/lazarus/components/led_control/src/ledcontrol.lpk'
  unittest-lpi-path:
    description: 'path to LedUnitTests.lpi'
    required: true
    default: 'src/utils/ui_editor/lazarus/components/led_control/test/LedUnitTests.lpi'


runs:
  using: composite
  steps:
    
    - name: Build LED control package
      shell: bash
      run: lazbuild -B --ws=${{ inputs.widgetset }} ${{ inputs.component-lpk-path }}

    - name: Build LED control unit tests
      shell: bash
      run: lazbuild -B --ws=${{ inputs.widgetset }} ${{ inputs.unittest-lpi-path }}  

    - name: Run LED control unit tests
      shell: bash
      env:
        UNITTEST_LPI: ${{ inputs.unittest-lpi-path }}
        MATRIX_NAME: ${{ matrix.name }}
      run: |
        set -euo pipefail
        unittest_runner="${UNITTEST_LPI%.*}"
        echo "unit test runner: $unittest_runner"

        case "$MATRIX_NAME" in
          Linux*)
          xvfb-run -a "$unittest_runner"
          ;;
        *)
          "$unittest_runner"
          ;;
        esac

        echo "## LED control unit tests Results 🚀" >> $GITHUB_STEP_SUMMARY
        if grep -q '<NumberOfErrors>0</NumberOfErrors>' result.xml && grep -q '<NumberOfFailures>0</NumberOfFailures>' result.xml; then
          echo "The build finished successfully at $(date)" >> $GITHUB_STEP_SUMMARY
        else
          echo "Unit tests failed at $(date)" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Add package to Lazarus
      shell: bash
      run: lazbuild --add-package ${{ inputs.component-src-path }}
 