[project]
name = "ehgk"
description = "electronical hourglass kit config package"
dynamic = ["version"]
requires-python = ">=3.10"
authors = [
    { name = "Michael Golovanov", email = "mike.golovanov@gmail.com" }
]

dependencies = [
    "intelhex",
    "lark",
    "jinja2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ehgk/__init__.py"

[dependency-groups]
dev = ["pytest>=9.1.1,<10.0.0"]
